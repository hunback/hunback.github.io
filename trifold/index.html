</style><main><a class="back" href="/designs/">세 가지 청첩장 보기</a><h1>3단형 청첩장</h1><p>깊은 네이비, 핑크빛 글씨, 함께 웃는 두 사람.<br>펼침 160 × 240mm · 접힘 160 × 107mm</p><a class="download" href="trifold-invitation.zip" download>이미지 · PDF 전체 받기</a><nav class="actions" aria-label="도안 보기"><button aria-pressed="true" onclick="show('inside','안쪽 펼침 도안',this)">안쪽</button><button aria-pressed="false" onclick="show('outside','바깥쪽 펼침 도안',this)">바깥쪽</button><button aria-pressed="false" onclick="show('folded-preview','접힌 모습과 접지 구조',this)">접힌 모습</button></nav><figure><img id="drawing" src="inside.jpg" alt="안쪽 펼침 도안"></figure><div class="notes"><p>위·아래를 접어 여는 3단형입니다. 접는 선은 위에서 66.5mm와 173.5mm입니다.<br>바깥 도안의 위·아래 글씨는 접었을 때 바르게 보이도록 거꾸로 배치했습니다.</p><p>PDF에는 사방 3mm 도련이 포함되어 있습니다. 제작 전에 인쇄소 칼선과 양면 방향을 확인해 주세요.</p></div></main><script>function show(file,alt,button){const im=document.getElementById('drawing');im.src=file+'.jpg';im.alt=alt;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}</script></html>
