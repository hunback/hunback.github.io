<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>훈백 · 지우 | 명함 청첩장 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#263550;font-family:system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:55px 24px}header{margin-bottom:35px}header small{letter-spacing:.22em}h1{font-size:clamp(27px,5vw,44px);font-weight:500}p{line-height:1.8;color:#666}nav{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}nav button,.download{padding:12px 18px;border:1px solid #c8cfdb;border-radius:25px;background:white;color:#263550;text-decoration:none;font:inherit;cursor:pointer}nav button[aria-pressed=true]{background:#293f86;color:white}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:30px 18px}.card{border:0;padding:0;background:none;text-align:left;cursor:zoom-in;color:inherit;font:inherit}.card img{width:100%;display:block;box-shadow:0 5px 16px #232a3817}.card span{display:block;margin-top:12px;font-size:14px}.card[hidden]{display:none}dialog{padding:20px;border:0;background:#f5f3ef;max-width:94vw;max-height:95vh}dialog::backdrop{background:#172132b8}dialog img{display:block;max-height:75vh;max-width:80vw;margin:auto}dialog button{display:block;margin:14px auto 0;background:white;border:1px solid #ccc;padding:10px 25px}footer{margin-top:45px}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:35px 18px}}
</style><main><header><small>HUNBAEK & JIWOO · 19 DECEMBER 2026</small><h1>우리의 작은 초대장</h1><p>앞면은 마음에 드는 사진으로, 뒷면은 한 가지 디자인으로.<br>세로 50 × 90mm · 앞면 사진 10종 · 뒷면 디자인 3종</p><a class="download" href="wedding-cards.zip" download>이미지 · PDF 전체 받기</a></header><nav aria-label="시안 구분"><button aria-pressed="true" onclick="filter('all',this)">전체 보기</button><button aria-pressed="false" onclick="filter('front',this)">앞면 10종</button><button aria-pressed="false" onclick="filter('back',this)">뒷면 3종</button></nav><div class="grid"><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-꽃다발과-함박웃음.jpg" alt="꽃다발과 함박웃음"><span>꽃다발과 함박웃음</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-노을-속-포옹.jpg" alt="노을 속 포옹"><span>노을 속 포옹</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-둘만의-축제.jpg" alt="둘만의 축제"><span>둘만의 축제</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-바이크와-노을.jpg" alt="바이크와 노을"><span>바이크와 노을</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-베일과-웃음.jpg" alt="베일과 웃음"><span>베일과 웃음</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-부케-사이의-미소.jpg" alt="부케 사이의 미소"><span>부케 사이의 미소</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-선글라스-커플.jpg" alt="선글라스 커플"><span>선글라스 커플</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-스튜디오의-온기.jpg" alt="스튜디오의 온기"><span>스튜디오의 온기</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-장난스러운-하루.jpg" alt="장난스러운 하루"><span>장난스러운 하루</span></button><button class="card" data-side="front" onclick="show(this)"><img loading="lazy" src="front-푸른-들판의-포옹.jpg" alt="푸른 들판의 포옹"><span>푸른 들판의 포옹</span></button><button class="card" data-side="back" onclick="show(this)"><img loading="lazy" src="back-blue-promise.jpg" alt="푸른 약속"><span>푸른 약속</span></button><button class="card" data-side="back" onclick="show(this)"><img loading="lazy" src="back-two-names.jpg" alt="둘의 이름"><span>둘의 이름</span></button><button class="card" data-side="back" onclick="show(this)"><img loading="lazy" src="back-winter-letter.jpg" alt="겨울의 편지"><span>겨울의 편지</span></button></div><footer><p>뒷면의 이름 · 일시 · 장소 · QR 정보는 모두 같습니다.<br>PNG는 재단 크기 600dpi, PDF는 사방 3mm 도련을 포함합니다.<br>인쇄 전에는 제작 업체의 규격과 색상 조건을 확인해 주세요.</p><a href="/">모바일 청첩장 보기</a></footer></main><dialog id="viewer"><img alt=""><button onclick="document.getElementById('viewer').close()">닫기</button></dialog><script>
function filter(side,button){document.querySelectorAll('.card').forEach(c=>c.hidden=side!=='all'&&c.dataset.side!==side);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}
function show(button){const dialog=document.getElementById('viewer'),from=button.querySelector('img'),to=dialog.querySelector('img');to.src=from.src;to.alt=from.alt;dialog.showModal()}
</script></html>
